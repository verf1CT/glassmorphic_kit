<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #1E1E1E;
      color: #E0E0E0;
    }
    h2 {
      margin-top: 0;
      font-size: 16px;
      color: #FFFFFF;
      font-weight: 500;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #888;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      height: 220px;
      background: #2D2D2D;
      border: 1px solid #444;
      border-radius: 8px;
      color: #A5D6FF;
      font-family: 'Courier New', Courier, monospace;
      padding: 12px;
      box-sizing: border-box;
      resize: none;
      font-size: 13px;
    }
    .copy-btn {
      background: #0D99FF;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .copy-btn:hover {
      background: #007BE5;
    }
  </style>
</head>
<body>
  <div class="container" id="content">
    <div class="empty-state" id="empty-state">
      Select a layer with background blur and fills to generate AnimatedGlassContainer code.
    </div>
    <div id="code-container" style="display: none;">
      <h2>Generated Dart Code</h2>
      <textarea id="code-output" readonly></textarea>
      <button class="copy-btn" id="copy-btn">Copy to Clipboard</button>
    </div>
  </div>

  <script>
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      const emptyState = document.getElementById('empty-state');
      const codeContainer = document.getElementById('code-container');
      const codeOutput = document.getElementById('code-output');

      if (msg.type === 'selection') {
        emptyState.style.display = 'none';
        codeContainer.style.display = 'block';
        
        const props = msg.props;
        const code = `AnimatedGlassContainer(
  blur: ${props.blur},
  color: ${props.color},
  borderRadius: BorderRadius.circular(16),
  child: const Padding(
    padding: EdgeInsets.all(24.0),
    child: Text('Glassmorphism'),
  ),
)`;
        codeOutput.value = code;
      } else if (msg.type === 'selection-cleared') {
        emptyState.style.display = 'block';
        codeContainer.style.display = 'none';
      }
    };

    document.getElementById('copy-btn').onclick = () => {
      const codeOutput = document.getElementById('code-output');
      codeOutput.select();
      document.execCommand('copy');
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => {
        btn.textContent = 'Copy to Clipboard';
      }, 2000);
    };
  </script>
</body>
</html>
